<!doctype html>
<html lang="uk">
   <head>
      <meta charset="UTF-8" />

      <link rel="stylesheet" href="css/register.css" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Сапер — Вхід</title>
   </head>
   <body>
      <div class="register-container">
         <div class="register-header">
            <div class="mine-icon">💣</div>
            <h1>Сапер</h1>
            <p>Увійдіть в акаунт, щоб продовжити гру</p>
         </div>

         <form method="post" action="/login">
            <div class="form-group">
               <label for="username">Нікнейм</label>
               <input
                  id="username"
                  type="text"
                  name="username"
                  placeholder="Ваш ігровий нік"
               />
            </div>

            <div class="form-group">
               <label for="password">Пароль</label>
               <input
                  id="password"
                  type="password"
                  name="password"
                  placeholder="Ваш пароль"
               />
            </div>
            <div class="error_log"></div>
            <button type="submit" class="btn-register">Увійти</button>
         </form>

         <div class="login-link">
            Ще немає акаунта? <a href="register.html">Зареєструватися</a>
         </div>

         <div class="decorations">
            <span>🚩</span>
            <span>💣</span>
            <span>1️⃣</span>
            <span>2️⃣</span>
            <span>🚩</span>
         </div>
      </div>
   </body>
</html>
